# One origin for the browser: the static app, plus /api and /uploads proxied to the API container.
# Same paths as the Vite dev proxy, so the app code never knows which one it runs behind.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Slightly above the API's own limit (5 MB image + form fields), so the API decides and answers with JSON.
    client_max_body_size 7m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8080;
        # Overwrite (not append) the client address: whatever X-Forwarded-For a client sends is replaced here,
        # so the API's per-IP limits see the real client and cannot be fooled by a forged header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # nginx drops ALL server-level add_header lines in a location that has its own add_header — repeat them.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Client-side routes (/tickets/123, /login) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
